# Builds ./docs with this repo's own DOCS0 (dogfooding) and deploys it to GitHub Pages.
# Requires Settings → Pages → Source: "GitHub Actions".
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so each page's "last updated" date comes from git
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Same command as a local run: output lands in the OS temp folder and its location is exposed via GITHUB_OUTPUT
      - id: docs
        run: node dist/docs0.js docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.docs.outputs.dir }}
      - id: deployment
        uses: actions/deploy-pages@v4
